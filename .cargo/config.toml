# Link the MSVC C runtime statically on Windows. With the default dynamic CRT, trackcut.exe
# imports VCRUNTIME140.dll / VCRUNTIME140_1.dll and fails to start on any PC without the Visual
# C++ Redistributable. The installer is per-user with no UAC prompt, so it can't install the
# redistributable itself. The cc crate follows this flag, so LAME and ring build with /MT too.
# CI checks the result with scripts/check-windows-crt.ps1.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
