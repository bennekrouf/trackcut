[workspace]
resolver = "2"
members = ["crates/core", "crates/audio", "crates/app"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.45"
edition = "2021"
# Source-available under PolyForm Noncommercial 1.0.0: free for personal use,
# commercial use needs a licence. See LICENSE and TRADEMARK.md.
license-file = "LICENSE"

[workspace.dependencies]
trackcut-core = { path = "crates/core" }
trackcut-audio = { path = "crates/audio" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
crossbeam-channel = "0.5"
dirs = "6"
symphonia = { version = "0.5.5", features = ["mp3", "isomp4", "aac"] }
cpal = "0.15"
dioxus = { version = "=0.7.10", features = ["desktop"] }
# What every mayorana desktop app shares: statistics, update check, notice and licence.
# Beside this repository; CI checks it out there at a pinned tag.
desktop-kit = { path = "../desktop-kit" }
tokio = { version = "1", features = ["time"] }
rfd = "0.15"
flacenc = "0.5"
ebur128 = "0.1"
realfft = "3.4"
mp3lame-encoder = "0.2"
base64 = "0.22"

# Decoding and peak building are far too slow unoptimised; keep debug builds usable.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.trackcut-audio]
opt-level = 3

# block 0.1.6 (via dioxus-desktop -> cocoa) is unmaintained and trips a future-incompat lint;
# vendor/block is the same release with that one type fixed.
[patch.crates-io]
block = { path = "vendor/block" }

[workspace.lints.clippy]
# The same lints in every desktop app. A panic is a crash the user sees, so unwrap and expect
# are refused outside tests, as is unsafe code without a SAFETY comment. Where one is right
# (a constant that cannot fail), allow it on that item and say why.
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
