[package]
name = "trackcut"
version.workspace = true
edition.workspace = true
description = "Split long MP3/WAV recordings into tracks"
license-file.workspace = true

[dependencies]
trackcut-core.workspace = true
trackcut-audio.workspace = true
dioxus.workspace = true
# rt and sync are used by the usage statistics (spawn_blocking, an async mutex).
# Dioxus enables both today; named here so this crate does not depend on that.
tokio = { workspace = true, features = ["rt", "sync"] }
rfd.workspace = true
crossbeam-channel.workspace = true
dirs.workspace = true
# Reads latest.json for the "new version available" banner.
serde.workspace = true
serde_json.workspace = true
# Decodes assets/icon.png into the runtime window icon; png is the only format needed.
image = { version = "0.25", default-features = false, features = ["png"] }
# Installing and updating yt-dlp and Deno for "Open URL" (download, verify, unzip), the
# licence check, the update check and usage statistics. Every request goes through `http`:
# platform-verifier checks certificates with the OS, so a company proxy's root certificate
# (Zscaler and the like) is trusted.
ureq = { version = "3.4.2", features = ["platform-verifier"] }
sha2 = "0.11.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Deleting a recording from the file list moves it to the system Trash, so it can be restored.
trash = "5.2"
base64.workspace = true
# The Copy buttons in the "Use TrackCut from Claude" window: the native clipboard, since the
# web view's clipboard API needs a secure origin and a gesture check that differ per platform.
arboard = "3"
# The anonymous install id for usage statistics: 128 random bits. Already
# in the tree via other crates, so this names a dependency rather than adding one.
getrandom = "0.3"

[dev-dependencies]
symphonia.workspace = true
# The usage-statistics tests run a throwaway local HTTP server.
tokio = { workspace = true, features = ["net", "io-util", "macros", "rt-multi-thread"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
